<!-- los_bewegen_hold.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los bewegen</title>
    <style>
        .main-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Lot ist im Zustand HOLD</h1>
    <a href="{{ url_for('los_bewegen.los_bewegen_page') }}" class="main-btn"><button>Back to Los-Bewegen-Page</button></a>
   <hr>

    <h2> Manuelles Setzen des Zustands für Los {{lotid}}</h2>
    <p> {{message}} </p>
    <form action="{{ url_for('los_bewegen.los_bewegen_page') }}" method="post">
        <input type="radio" id="scrap" name="state" value="scrap" required>
        <label for="hold">SCRAP</label>
        <br>
        <input type="radio" id="op_comp" name="state" value="op_comp" required>
        <label for="op_comp">OP_COMP</label>
        <br>
        <!-- verstecktes Feld mit LotID -->
        <input type="hidden" name="lotid_hidden" value="{{lotid}}">
        <button type="submit">Submit</button>
    </form>

</body>
</html>
