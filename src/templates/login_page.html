<!-- login_page.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login.css') }}">
    </head>
    <h1>Login</h1>
    
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="off" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <input type="submit" value="Login">
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Verhindert das Standardverhalten des Formulars (das Neu Laden der Seite)

            var formData = new FormData(this); // FormData-Objekt erstellen, um die Formulardaten zu erfassen
            var username = formData.get("username");
            var password = formData.get("password");

            // AJAX-Anfrage senden
            var url = '/login_check'; // Ziel-URL
            var requestData = {
                username: username,
                password: password
            };

            fetch(url, {
                method: 'POST', // oder 'GET', 'PUT', usw., je nach Bedarf
                headers: {
                    'Content-Type': 'application/json', // oder andere benötigte Header
                },
                body: JSON.stringify(requestData), // Daten in das gewünschte Format umwandeln (JSON)
            })
            .then(response => response.json()) // Antwort in JSON-Format parsen
            .then(data => {
                // Daten verarbeiten (z. B. Rückgabewerte überprüfen)
                console.log('Response:', data);
                // Hier können Sie die Antwort weiter verarbeiten oder entsprechende Aktionen ausführen

                // Beispiel: Weiterleitung zur entsprechenden Seite bei erfolgreicher Anmeldung
                if (data.status === "success") {
                    if (data.user === "user1") {
                        window.location.href = "/main"; // Weiter zur Profilseite für user1
                    } else if (data.user === "user2") {
                        window.location.href = "/main2"; // Weiter zur Profilseite für user2
                    }
                } else {
                    alert("Invalid username or password. Please try again.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Fehlerbehandlung, z. B. eine Fehlermeldung anzeigen
            });
        });
    </script>

</body>
</html>
