<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <main>

    <header>
        <h1>Fabrikbetrieb - {{appname}}</h1>
    </header>

    <!-- <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav> -->

    <a href="{{ url_for('login.logout') }}" id="logoutbutton"><button>Log out</button></a>


    <div class="information-container">
        <!--Hinweis, dass Angabe in Wafer-->
        <br>
        <div class="infohor">
            <label class="infolabel">WIP</label><output type="number">{{WIPA}}</output>
        </div>
        <div class="infohor">
            <label class="infolabel">HOLD</label><output type="number">{{lotshold}}</output>
        </div>
        <div class="infohor">
            <label class="infolabel">MVS/hr</label><output type="number">00</output>
        </div>
        <br>
        <div class="infohor">
            <label class="infolabel">COMP</label><output type="number">{{lotsopcomp}}</output>
        </div>
        <div class="infohor">
            <label class="infolabel">FIN</label><output type="number">{{lotsfin}}</output>
        </div>
        <div class="infohor">
            <label id="hinweis">(Angaben in Wafer)</label>
        </div>
    </div>

    <div class="information-container">
        <div class="infovert">
            <label class="infolabel">TOOLS</label><br>
            <output type="number">{{ toolsanzahl }}</output>
        </div>
        <div class="infovert">
            <label class="infolabel">IDLE</label><br>
            <output type="number">{{ toolsidle }}</output>
        </div>
        <div class="infovert">
            <label class="infolabel">PROD</label><br>
            <output type="number">{{ toolsprod }}</output>
        </div>
        <div class="infovert">
            <label class="infolabel">MAINT</label><br>
            <output type="number">{{ toolsmaint }}</output>
        </div>
        <div class="infovert">
            <label class="infolabel">DOWN</label><br>
            <output type="number">{{ toolsdown }}</output>
        </div>
    </div>



    <div class="functions-container">
        <div class="functionbuttons">
            <label>Operations</label><br>
            <a href="{{ url_for('los_starten.los_starten_page') }}"><button type="button">starten</button><br></a>

            <!-- nächste 2 Buttons werden nur angezeigt, wenn per Jinja2 übergebener username=user1-->
            {% if username == 'user1' %}
                <a href="{{ url_for('los_bearbeiten.los_bearbeiten_page') }}"><button type="button">bearbeiten</button><br></a>
                <a href="{{ url_for('los_bewegen.los_bewegen_page') }}"><button type="button">bewegen</button></a>
            {% endif %}
        </div>

        <div class="functionbuttons">
            <label>Anpassung</label><br>
            {% if username == 'user1' %}
            <button type="button">Stammdaten</button><br>
            <button type="button">Testsystem</button><br>
            {% endif %}
            <a href="{{ url_for('entities.entities_index') }}"><button type="button">Prototyp</button></a>
        </div>
        
        <div class="functionbuttons">
            <label>Funktionen</label><br>
            {% if username == 'user1' %}
            <button type="button">Daten visualisieren</button><br>
            <button type="button">Backup erstellen</button><br>
            <button type="button">Fertigungsplan ansehen</button>
            {% endif %}
        </div>
        
        <div class="functionbuttons">
            <label>Daten</label><br>
            <a href="{{ url_for('import_data.import_data_page') }}"><button type="button">Daten importieren</button></a><br>
            <a href="{{ url_for('export_data.export_data_page') }}"><button type="button">Daten exportieren</button></a>
        </div>
    </div>
        
    </main> 


</body>
</html>
